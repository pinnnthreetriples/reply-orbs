name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate repository
        shell: pwsh
        run: ./ci/check.ps1

  windows:
    name: Windows build and tests
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compile with warnings as errors and run regression suite
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          ./build.ps1 -Test
          $summary = Get-Content -LiteralPath ./verification.txt -Encoding UTF8 -TotalCount 1
          if ($summary -notmatch '^PASS . (\d+) checks$' -or [int]$Matches[1] -lt 157) {
            throw 'The regression suite must pass at least 157 checks.'
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Build or tests changed tracked files.' }
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ github.run_id }}
          path: verification.txt
          if-no-files-found: error
          retention-days: 14
